services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aqiexplainer-api
    command: sh scripts/start.sh
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aqiexplainer-ui
    command: python -m streamlit run ui/app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - api
    environment:
      API_URL: http://api:8000